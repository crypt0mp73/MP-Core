<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP-CORE — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.glass{background:rgba(24,24,27,.85);backdrop-filter:blur(12px);border:1px solid rgba(63,63,70,.5);border-radius:16px}
.input{background:rgba(39,39,42,.6);border:1px solid rgba(63,63,70,.5);color:#e5e5e5;border-radius:8px;padding:10px 14px;width:100%}
.input:focus{outline:none;border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.btn{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:600;padding:10px;border-radius:8px;width:100%;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(139,92,246,.4)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center">
<div class="glass p-8 w-full max-w-sm mx-4">
  <div class="text-center mb-6">
    <div class="w-14 h-14 bg-gradient-to-br from-purple-500 to-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-xl shadow-lg mx-auto mb-3">MP</div>
    <h1 class="text-2xl font-bold text-white">MP-CORE</h1>
    <p class="text-zinc-500 text-sm mt-1">Sign in to your panel</p>
  </div>

  <div id="err" style="display:none" class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg p-3 mb-4">
    Invalid username or password
  </div>

  <form method="POST" action="/login" class="space-y-4">
    <div>
      <label class="block text-zinc-400 text-sm mb-2">Username</label>
      <input type="text" name="username" required class="input" placeholder="admin">
    </div>
    <div>
      <label class="block text-zinc-400 text-sm mb-2">Password</label>
      <input type="password" name="password" required class="input" placeholder="••••••••">
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>

<script>
if (new URLSearchParams(location.search).has('error')) {
  document.getElementById('err').style.display = 'block';
}
</script>
</body>
</html>

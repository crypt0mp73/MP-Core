name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Fetch deps
        run: |
          go mod tidy
          cat go.mod
          cat go.sum
      - name: Build amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o mp-core-amd64 .
          chmod +x mp-core-amd64
          sha256sum mp-core-amd64 > mp-core-amd64.sha256
      - name: Build arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o mp-core-arm64 .
          chmod +x mp-core-arm64
          sha256sum mp-core-arm64 > mp-core-arm64.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mp-core-amd64
            mp-core-amd64.sha256
            mp-core-arm64
            mp-core-arm64.sha256
          name: MP-CORE ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
